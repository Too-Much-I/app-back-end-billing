spring:
  application:
    name: app-back-end-billing
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/tosunsaeng_billing}
      auto-index-creation: false

billing:
  workload-jwt:
    receiver-enabled: ${BILLING_WORKLOAD_JWT_RECEIVER_ENABLED:false}
    learning-core-receiver-enabled: ${BILLING_WORKLOAD_LEARNING_CORE_RECEIVER_ENABLED:false}
    learning-core-public-jwk-set: ${BILLING_WORKLOAD_LEARNING_CORE_PUBLIC_JWK_SET:}
    port: ${BILLING_WORKLOAD_JWT_PORT:0}
    environment: ${BILLING_WORKLOAD_JWT_ENVIRONMENT:}
    identity-public-jwk-set: ${BILLING_WORKLOAD_IDENTITY_PUBLIC_JWK_SET:}
    billing-private-jwk: ${BILLING_WORKLOAD_PRIVATE_JWK:}
    tls-key-store: ${BILLING_WORKLOAD_TLS_KEY_STORE:}
    tls-key-store-password: ${BILLING_WORKLOAD_TLS_KEY_STORE_PASSWORD:}
  payment:
    sync-enabled: ${BILLING_PAYMENT_SYNC_ENABLED:false}
    provider:
      slack:
        enabled: ${BILLING_PAYMENT_PROVIDER_SLACK_ENABLED:false}
        webhook-url: ${BILLING_PAYMENT_PROVIDER_SLACK_WEBHOOK_URL:}
      ingress-enabled: ${BILLING_PAYMENT_PROVIDER_INGRESS_ENABLED:false}
      host: ${BILLING_PAYMENT_PROVIDER_HOST:}
      project: ${BILLING_PAYMENT_PROVIDER_PROJECT:}
      authorization: ${BILLING_PAYMENT_PROVIDER_AUTHORIZATION:}
      signing-secret: ${BILLING_PAYMENT_PROVIDER_SIGNING_SECRET:}
      lookup-key: ${BILLING_PAYMENT_PROVIDER_LOOKUP_KEY:}
      lookup-key-version: ${BILLING_PAYMENT_PROVIDER_LOOKUP_KEY_VERSION:}
      worker:
        terminal-sync-delete-enabled: ${BILLING_PAYMENT_PROVIDER_TERMINAL_SYNC_DELETE_ENABLED:false}
        reference-retention-enabled: ${BILLING_PAYMENT_PROVIDER_REFERENCE_RETENTION_ENABLED:false}
        reconciliation-enabled: ${BILLING_PAYMENT_PROVIDER_RECONCILIATION_ENABLED:false}
        alerts-enabled: ${BILLING_PAYMENT_PROVIDER_ALERTS_ENABLED:false}
        enabled: ${BILLING_PAYMENT_PROVIDER_WORKER_ENABLED:false}
        poll-millis: ${BILLING_PAYMENT_PROVIDER_WORKER_POLL_MILLIS:1000}
        batch: ${BILLING_PAYMENT_PROVIDER_WORKER_BATCH:100}
        api-key: ${BILLING_PAYMENT_PROVIDER_API_KEY:}
        budget-database: ${BILLING_PAYMENT_PROVIDER_BUDGET_DATABASE:}
        reference-key: ${BILLING_PAYMENT_PROVIDER_REFERENCE_KEY:}
        reference-key-id: ${BILLING_PAYMENT_PROVIDER_REFERENCE_KEY_ID:}
    entitlement-query-enabled: ${BILLING_PAYMENT_ENTITLEMENT_QUERY_ENABLED:false}
    catalog-enabled: ${BILLING_PAYMENT_CATALOG_ENABLED:false}
    purchase-account-enabled: ${BILLING_PAYMENT_PURCHASE_ACCOUNT_ENABLED:false}
    withdrawal-enabled: ${BILLING_PAYMENT_WITHDRAWAL_ENABLED:false}
    cleanup:
      reconciliation-enabled: ${BILLING_PAYMENT_CLEANUP_RECONCILIATION_ENABLED:false}
      purge-enabled: ${BILLING_PAYMENT_CLEANUP_PURGE_ENABLED:false}
      alerts-enabled: ${BILLING_PAYMENT_CLEANUP_ALERTS_ENABLED:false}
    recovery:
      fence-required: ${BILLING_PAYMENT_RECOVERY_FENCE_REQUIRED:false}
      snapshot-enabled: ${BILLING_PAYMENT_RECOVERY_SNAPSHOT_ENABLED:false}
      feed-enabled: ${BILLING_PAYMENT_RECOVERY_FEED_ENABLED:false}
      snapshot-worker-enabled: ${BILLING_PAYMENT_RECOVERY_SNAPSHOT_WORKER_ENABLED:false}
      retention-enabled: ${BILLING_PAYMENT_RECOVERY_RETENTION_ENABLED:false}
      http-enabled: ${BILLING_PAYMENT_RECOVERY_HTTP_ENABLED:false}
      identity-base-url: ${BILLING_PAYMENT_RECOVERY_IDENTITY_BASE_URL:}
      identity-allowed-host: ${BILLING_PAYMENT_RECOVERY_IDENTITY_ALLOWED_HOST:}
      identity-environment: ${BILLING_PAYMENT_RECOVERY_IDENTITY_ENVIRONMENT:}
    environment: ${BILLING_PAYMENT_ENVIRONMENT:}
    catalog-version: ${BILLING_PAYMENT_CATALOG_VERSION:1}
    limiter-key: ${BILLING_PAYMENT_LIMITER_KEY:}
  entitlement-query:
    enabled: ${BILLING_ENTITLEMENT_QUERY_ENABLED:false}
    public-connector-enabled: ${BILLING_PUBLIC_CONNECTOR_ENABLED:false}
    public-port: ${BILLING_PUBLIC_PORT:8083}
    issuer: ${BILLING_USER_JWT_ISSUER:}
    jwks-uri: ${BILLING_USER_JWT_JWKS_URI:}
    clock-skew: ${BILLING_USER_JWT_CLOCK_SKEW:60s}
    legacy-attribution-verified: ${BILLING_LEGACY_ATTRIBUTION_VERIFIED:false}
  internal-ingress:
    mode: ${BILLING_INTERNAL_INGRESS_MODE:disabled}
    lattice-only: ${BILLING_INTERNAL_LATTICE_ONLY:false}
    environment: ${BILLING_ENVIRONMENT:}
  trial-eligibility:
    expected-consumer-scope-id: ${BILLING_TRIAL_EXPECTED_CONSUMER_SCOPE_ID:}
  reservation:
    paid-foundation-enabled: ${BILLING_PAID_EXAM_FOUNDATION_ENABLED:false}
    paid-admission-enabled: ${BILLING_PAID_ADMISSION_ENABLED:false}
    hold-duration: ${BILLING_RESERVATION_HOLD_DURATION:5m}
    expiry-enabled: ${BILLING_RESERVATION_EXPIRY_ENABLED:false}
    expiry-scan-interval: ${BILLING_RESERVATION_EXPIRY_SCAN_INTERVAL:10s}
    expiry-batch-size: ${BILLING_RESERVATION_EXPIRY_BATCH_SIZE:100}
    terminal-command-retention: ${BILLING_RESERVATION_TERMINAL_COMMAND_RETENTION:7d}
  attempt-group-events:
    enabled: ${BILLING_ATTEMPT_GROUP_EVENTS_ENABLED:false}
    max-future-skew: ${BILLING_ATTEMPT_GROUP_EVENTS_MAX_FUTURE_SKEW:30s}
  owner-rebind:
    enabled: ${BILLING_OWNER_REBIND_ENABLED:false}
    max-future-skew: ${BILLING_OWNER_REBIND_MAX_FUTURE_SKEW:30s}
    inbox-retention: ${BILLING_OWNER_REBIND_INBOX_RETENTION:120d}
    legacy-fence-retention: ${BILLING_OWNER_REBIND_LEGACY_FENCE_RETENTION:120d}
    cleanup-enabled: ${BILLING_OWNER_REBIND_CLEANUP_ENABLED:false}
    cleanup-scan-interval: ${BILLING_OWNER_REBIND_CLEANUP_SCAN_INTERVAL:1h}
    cleanup-batch-size: ${BILLING_OWNER_REBIND_CLEANUP_BATCH_SIZE:100}
    max-subjects-per-event: ${BILLING_OWNER_REBIND_MAX_SUBJECTS_PER_EVENT:100}
  mongodb:
    initialize-indexes: ${BILLING_MONGODB_INITIALIZE_INDEXES:false}
    require-transactions: ${BILLING_MONGODB_REQUIRE_TRANSACTIONS:false}
    schema-version: 4

server:
  port: ${SERVER_PORT:8082}

management:
  tracing:
    enabled: ${BILLING_TRACING_ENABLED:true}
    baggage:
      enabled: false
    propagation:
      type: w3c
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] traceId=%X{traceId:-} spanId=%X{spanId:-} %logger{36} - %msg%n"
